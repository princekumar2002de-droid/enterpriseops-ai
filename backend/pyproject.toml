[project]
name = "enterpriseops-backend"
version = "0.1.0"
description = "EnterpriseOps AI – backend API, domain services and agent layer"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "python-dotenv>=1.0",
    "faker>=30",
]

[tool.uv]
# This is an application, not a library: no wheel is built.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S608"]  # asserts, dummy credentials, test SQL
# Synthetic data: non-cryptographic randomness is intended; SQL is built from constants.
"data_generation/**" = ["S311", "S608"]
# KPI SQL is assembled from module constants only; user input is always a bound parameter.
"app/services/kpis.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "data_generation", "evaluation", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running PostgreSQL (EOPS_TEST_DATABASE_URL)",
]

[tool.coverage.run]
source = ["app", "data_generation", "evaluation"]
branch = true
